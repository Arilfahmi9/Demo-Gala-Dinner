  /* Gala theme: midnight violet, gold, magenta and orange ribbons */
  --bg:#160e33; --bg-glow:#3b1a6e; --surface:rgba(34,20,78,.86); --surface-2:rgba(255,255,255,.06); --ink:#FBF3DC; --muted:#C8BDE6; --line:rgba(242,207,115,.28);
  --gold:#F2CF73; --gold-2:#C9962E; --on-gold:#1d1140; --ok:#7EE0B8; --warn:#FFA48C;
  --jade:#8B3FC1; --saffron:#F59E2B; --rose:#E0228A; --lapis:#4A63E0;
  --display:"Montserrat","Segoe UI",system-ui,Arial,sans-serif;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Montserrat","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.bgart{position:fixed;inset:0;z-index:-1;background-color:#1b1040;
  background-image:linear-gradient(180deg,rgba(18,10,42,.55) 0%,rgba(18,10,42,.25) 45%,rgba(18,10,42,.35) 100%),var(--art);
  background-size:cover,cover;background-position:center,center bottom;background-repeat:no-repeat}
@media (orientation:portrait){ .bgart{background-size:cover,auto 100%} }
.shell{max-width:1240px;margin:0 auto}
.brand{text-align:center;margin:.5rem auto 1.6rem;max-width:46rem}
.brand .logos{display:block;width:min(94%,660px);height:auto;margin:0 auto clamp(1rem,3vh,2rem)}
.brand .kick{margin:0;font-weight:600;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-size:clamp(.85rem,2.4vw,1.6rem);padding-left:.38em}
.brand .ttl{margin:.15em 0 .1em;font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:.015em;text-transform:uppercase;font-size:clamp(2.1rem,7.2vw,4.8rem);
  background:linear-gradient(180deg,#FFF0B8 0%,#F2CF73 50%,#D5A443 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}

@keyframes popw{from{transform:scaleX(1.12) scale(.6);opacity:0}to{transform:scaleX(1.12) scale(1);opacity:1}}
.ld-panel{padding:.6vh 1.5vw}
.ld-line{font-size:clamp(1rem,1.9vw,2rem)}
/* compact registration form */
body:not(.drawmode):not(.wide):not(.postermode) .card{padding:1.1rem 1.1rem 1.2rem;border-radius:16px}
body:not(.drawmode):not(.wide):not(.postermode) .card h2{font-size:1.02rem;letter-spacing:.12em;margin:0 0 .2rem}
label.f{font-size:.84rem;margin-top:.75rem}
input[type=text],input[type=tel],input[type=password],select{font-size:.98rem;padding:.6rem .85rem;border-radius:10px;margin-top:.25rem}
.btn.big{padding:.8rem;font-size:1rem;margin-top:1rem}
.msg{margin:.4rem 0 0;font-size:.9rem}
.steps{margin:0 0 .8rem;font-size:.8rem}
.steps li b{width:1.3rem;height:1.3rem;font-size:.72rem}
.who{font-size:clamp(1.4rem,5vw,2rem)}
.lucky{font-size:clamp(4rem,20vw,6.5rem)}
@media (min-width:900px) and (orientation:landscape){
  body:not(.wide):not(.drawmode):not(.postermode) main{max-width:27rem}
  body:not(.wide):not(.drawmode):not(.postermode) .brand .ttl{font-size:clamp(2rem,4.4vw,4.4rem)}
  body:not(.wide):not(.drawmode):not(.postermode) .brand .motto{font-size:clamp(1rem,1.6vw,1.5rem)}
  body:not(.wide):not(.drawmode):not(.postermode) .brand .kick{font-size:clamp(.85rem,1.5vw,1.3rem)}
}
/* extra-compact registration form */
body:not(.drawmode):not(.wide):not(.postermode) main{max-width:25rem}
body:not(.drawmode):not(.wide):not(.postermode) .card{padding:.9rem .95rem 1rem;border-radius:14px}
body:not(.drawmode):not(.wide):not(.postermode) .card h2{font-size:.9rem;letter-spacing:.14em;margin:0}
label.f{font-size:.76rem;margin-top:.55rem;letter-spacing:.01em}
input[type=text],input[type=tel],input[type=password],select{font-size:.9rem;padding:.48rem .75rem;border-radius:9px;margin-top:.2rem}
.btn.big{padding:.68rem;font-size:.92rem;margin-top:.85rem}
.msg{font-size:.82rem;min-height:0}
.steps{font-size:.74rem;margin:0 0 .6rem;gap:.3rem}
.steps li b{width:1.15rem;height:1.15rem;font-size:.66rem}
@media (min-width:900px) and (orientation:landscape){
  body:not(.wide):not(.drawmode):not(.postermode) main{max-width:24rem}
}
/* phone view (what staff see after scanning) */
@media (max-width:600px){
  body{padding:calc(.9rem + env(safe-area-inset-top,0px)) .8rem calc(2rem + env(safe-area-inset-bottom,0px))}
  .brand{margin:.1rem auto .9rem}
  .brand .logos{width:min(100%,320px);margin-bottom:.7rem}
  .brand .kick{font-size:.7rem;letter-spacing:.3em}
  .brand .ttl{font-size:1.7rem;margin:.1em 0}
  .brand .motto{font-size:.92rem;gap:.5rem}
  .brand .motto::before,.brand .motto::after{flex-basis:1.4rem}
  .brand .when{font-size:.74rem;margin-top:.5rem;gap:.1rem}
  body:not(.drawmode):not(.wide):not(.postermode) main{max-width:100%}
  body:not(.drawmode):not(.wide):not(.postermode) .card{padding:1rem .95rem 1.1rem}
  body:not(.drawmode):not(.wide):not(.postermode) .card h2{font-size:.88rem}
  .steps{font-size:.7rem;margin-bottom:.55rem}
  label.f{font-size:.8rem;margin-top:.65rem}
  /* 16px stops iPhones zooming in when a field is tapped; 44px is a comfortable touch target */
  input[type=text],input[type=tel],input[type=password],select{font-size:16px;min-height:44px;padding:.55rem .8rem}
  .btn.big{min-height:48px;font-size:1rem;margin-top:.95rem}
  .who{font-size:1.5rem}
  .lucky{font-size:clamp(4.2rem,24vw,6rem)}
}
/* dashboard: compact header, totals, live */
body.dashmode .brand{margin:0 auto 1rem}
body.dashmode .brand .logos{width:min(70%,420px);margin-bottom:.6rem}
body.dashmode .brand .kick{font-size:clamp(.7rem,1vw,.95rem)}
body.dashmode .brand .ttl{font-size:clamp(1.5rem,2.8vw,2.6rem)}
body.dashmode .brand .motto{font-size:clamp(.9rem,1.2vw,1.15rem)}
body.dashmode .brand .when{font-size:clamp(.72rem,.95vw,.9rem);margin-top:.5rem}
.db-top{display:grid;grid-template-columns:minmax(14rem,.8fr) 2.2fr;gap:1rem;align-items:stretch}
.db-total{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1rem 1.2rem;display:flex;flex-direction:column;justify-content:center}
.db-label{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.db-total-num{font-family:var(--display);font-weight:800;font-size:clamp(3rem,6vw,5rem);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.db-bump{animation:dbbump .9s ease}
@keyframes dbbump{0%{transform:scale(1)}30%{transform:scale(1.18);color:#fff}100%{transform:scale(1)}}
.db-live{display:flex;align-items:center;gap:.45rem;margin:.4rem 0 0;font-size:.8rem;font-weight:700;color:var(--ok)}
.db-live.off{color:var(--warn)}
.db-dot{width:.6rem;height:.6rem;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:dbpulse 1.8s infinite}
@keyframes dbpulse{0%{box-shadow:0 0 0 0 rgba(126,224,184,.6)}70%{box-shadow:0 0 0 .55rem rgba(126,224,184,0)}100%{box-shadow:0 0 0 0 rgba(126,224,184,0)}}
.db-sub{margin:.2rem 0 0;font-size:.74rem;color:var(--muted)}
.db-orgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.7rem}
.db-org{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.7rem;align-items:center}
.db-org-n{grid-row:1/3;font-family:var(--display);font-weight:800;font-size:2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.db-org-name{font-size:.82rem;font-weight:600;color:var(--muted);line-height:1.2}
.db-org-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.35rem}
.db-org-bar i{display:block;height:100%;border-radius:999px;transition:width .6s}
.db-actions{margin:.9rem 0 0}
.db-grid{margin-top:1rem}
.db-grid .card{padding:1rem 1.1rem}
.db-grid h2{font-size:1rem;margin:0 0 .6rem}
.db-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.db-pill{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem}
.db-depts{max-height:56vh;overflow:auto;padding-right:.3rem}
body.dashmode .dept{grid-template-columns:minmax(0,1.6fr) 1.4fr 2.2rem;gap:.6rem;margin:.35rem 0;font-size:.88rem}
body.dashmode .dept .dname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dashmode .dept .dnum{font-weight:800;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
body.dashmode .dept .fill{transition:width .6s}
body.dashmode .feed{max-height:56vh;overflow:auto}
body.dashmode .feed li{padding:.45rem 0;font-size:.9rem}
@media (max-width:820px){ .db-top{grid-template-columns:1fr} }
@media (max-width:820px){ .grid{grid-template-columns:1fr} }
@media print{ body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact} body::after{display:none} .brand,.noprint,.toast,.demobar,.demonote{display:none!important} .poster{max-width:none} }
@media (prefers-reduced-motion:reduce){ .pop{animation:none} .toast{transition:none} }

</style>

<script>
/* ===== The only setting: your Apps Script web app link (ends in /exec) ===== */
var API_URL = "https://script.google.com/macros/s/AKfycbz-LqSpkU2MoQ6f_lpfujrstRI8NuJX8VXITolHSNSiU3nIiK0Az_Hj4nz5vJsXv53wRQ/exec";
var BOOT = null;
/* All data goes to the Google Sheet through the Apps Script API. No Google sign-in is used. */
async function apiPost(fn, args){
  let res, text = "";
  try{
    res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:fn, args:args || []}), credentials:"omit", redirect:"follow"});
    text = await res.text();
  }catch(e){ const err = new Error("No connection. Check your Wi-Fi or mobile data and try again."); err.detail = "network: " + (e && e.message); throw err; }
  let data = null; try{ data = JSON.parse(text); }catch(e){}
  if (!data){
    const err = new Error("The registration system isn’t ready. Please go to the registration counter.");
    err.detail = /doPost/i.test(text) ? "Apps Script has no doPost: paste the latest Code.gs and deploy a New version." : ("status " + (res && res.status) + ": " + text.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 160));
    throw err;
  }
  if (!data.ok) throw new Error(data.error || "Something went wrong. Please try again.");
  return data.result;
}
async function call(fn, ...args){ return apiPost(fn, args); }
window.__apiPost = apiPost;
</script>
<script>
window.__startApp = function(){
"use strict";
if (BOOT.demo){ const dm = document.createElement("div"); dm.className = "demo-badge"; dm.textContent = "DEMO"; dm.title = "Demo version with sample data"; document.body.append(dm); }
const B = BOOT, app = document.getElementById("app"), KEY = "ghg-simple-reg-v1";
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "text") e.textContent = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  kids.flat().forEach(c => c != null && e.append(c));
  return e;
}
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3500); }

function errText(e){ return (e && e.message ? e.message : "Something went wrong. Please try again.").replace(/^Exception:\s*/, ""); }
function clear(){ app.innerHTML = ""; }
function remember(r){ if (B.view === "kiosk") return; try{ localStorage.setItem(KEY, JSON.stringify(r)); }catch(e){} }
function remembered(){ if (B.view === "kiosk") return null; try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function forget(){ try{ localStorage.removeItem(KEY); }catch(e){} }
function deviceId(){
  try{
    let d = localStorage.getItem("ghg-device");
    if (!d){ d = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)); localStorage.setItem("ghg-device", d); }
    return d;
  }catch(e){ return ""; }
}
function kioskPinGate(next){
  const saved = sessionStorage.getItem("ghg-pin");
  if (saved){ next(); return; }
  clear();
  const inp = el("input", {type:"password", inputmode:"numeric", autocomplete:"off", "aria-label":"Staff PIN", placeholder:"Staff PIN"});
  const msg = el("p", {class:"msg", role:"status"});
  const btn = el("button", {class:"btn primary big", type:"submit", text:"Open registration desk"});
  const f = el("form", null, inp, msg, btn);
  f.addEventListener("submit", async e => { e.preventDefault(); btn.disabled = true;
    try{ await call("apiCheckPin", inp.value); sessionStorage.setItem("ghg-pin", inp.value); next(); }
    catch(err){ msg.textContent = errText(err); btn.disabled = false; inp.select(); } });
  app.append(el("div", {class:"card center"}, el("h2", {text:"Registration desk"}), el("p", {class:"muted", text:"Enter the staff PIN to use this device for registering guests."}), f));
  inp.focus();
}

/* ---------- registration form ---------- */
function viewForm(){
  clear();
  if (!B.open){
    app.append(el("div", {class:"card center"}, el("h2", {text:"Registration is closed"}), el("p", {class:"muted", text:"Please ask at the registration counter."})));
    return;
  }
  const mem = remembered();
  if (mem){ viewResult(mem, "You’re registered. Enjoy the evening!", false); return; }
  const name = el("input", {type:"text", id:"name", autocomplete:"name", autocapitalize:"words", required:true});
  const org = el("select", {id:"org", required:true},
    el("option", {value:"", text:"Choose your organisation"}),
    (B.orgs || []).map(o => el("option", {value:o, text:o})));
  const phone = el("input", {type:"tel", id:"phone", inputmode:"tel", autocomplete:"tel", placeholder:"e.g. 012-345 6789"});
  const sid = el("input", {type:"text", id:"sid", autocomplete:"off", autocapitalize:"characters", placeholder: B.staffIdRequired ? "e.g. UOC1234" : "Leave blank if you’re a guest"});
  let dept;
  if (B.departments && B.departments.length){
    dept = el("select", {id:"dept", required:true},
      el("option", {value:"", text:"Choose your department"}),
      B.departments.map(d => el("option", {value:d, text:d})),
      el("option", {value:"__other", text:"Other"}));
  } else {
    dept = el("input", {type:"text", id:"dept", autocomplete:"organization", required:true});
  }
  const other = el("input", {type:"text", id:"deptOther", placeholder:"Type your department", hidden:true, "aria-label":"Your department"});
  if (dept.tagName === "SELECT") dept.addEventListener("change", () => { other.hidden = dept.value !== "__other"; if (!other.hidden) other.focus(); });
  const msg = el("p", {class:"msg", role:"status"});
  const btn = el("button", {class:"btn primary big", type:"submit", text:"Register and get my number"});
  const form = el("form", {novalidate:true},
    el("label", {class:"f", for:"name", text:"Full name"}), name,
    el("label", {class:"f", for:"sid", text: B.staffIdRequired ? "Staff ID" : "Staff ID (optional)"}), sid,
    el("label", {class:"f", for:"phone", text: B.phoneRequired ? "Phone number" : "Phone number (optional)"}), phone,
    el("label", {class:"f", for:"org", text:"Organisation"}), org,
    el("label", {class:"f", for:"dept", text:"Department"}), dept, other,
    msg, btn);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const n = name.value.trim(), d = (dept.value === "__other" ? other.value : dept.value).trim();
    const sv = sid.value.trim();
    if (!n){ msg.textContent = "Please enter your full name."; name.focus(); return; }
    if (B.staffIdRequired && !sv){ msg.textContent = "Please enter your staff ID."; sid.focus(); return; }
    const pv = phone.value.trim(), pd = pv.replace(/\D/g, "");
    if (B.phoneRequired && !pd){ msg.textContent = "Please enter your phone number."; phone.focus(); return; }
    if (pd && (pd.length < 9 || pd.length > 15)){ msg.textContent = "Please check your phone number."; phone.focus(); return; }
    if (!org.value){ msg.textContent = "Please choose your organisation."; org.focus(); return; }
    if (!d){ msg.textContent = "Please choose your department."; (dept.value === "__other" ? other : dept).focus(); return; }
    btn.disabled = true; btn.textContent = "Registering"; msg.textContent = "";
    try{
      const r = await call("apiRegister", {name:n, staffId:sv, phone:pv, org:org.value, dept:d, deviceId: B.view === "kiosk" ? "" : deviceId(), pin: B.view === "kiosk" ? (sessionStorage.getItem("ghg-pin") || "") : ""});
      remember(r);
      viewResult(r, r.status === "already" ? "You’re already registered." : "You’re registered. Enjoy the evening!", true);
    }catch(err){ msg.textContent = errText(err); btn.disabled = false; btn.textContent = "Register and get my number"; }
  });
  app.append(
    el("ol", {class:"steps", "aria-label":"How it works"},
      el("li", null, el("b", {text:"1"}), "Scan"), el("li", null, el("b", {text:"2"}), "Your details"), el("li", null, el("b", {text:"3"}), "Get your number")),
    el("div", {class:"card"}, el("h2", {class:"center", text:"Register for the gala"}), form));
  name.focus();
}

/* ---------- result ---------- */
let kioskTimer = null;
function viewResult(r, headline, fresh){
  clear(); clearInterval(kioskTimer);
  const card = el("div", {class:"card center"},
    el("p", {class:"status" + (r.status === "already" ? " warn" : ""), text:headline}),
    el("p", {class:"who", text:r.name}), el("p", {class:"meta", text:[r.staffId, r.org, r.dept].filter(Boolean).join(" · ")}),
    el("p", {class:"numlabel", text:"Your lucky draw number"}),
    el("p", {class:"lucky" + (fresh ? " pop" : ""), text:String(r.luckyNo)}),
    el("p", {class:"muted small", text: B.view === "kiosk" ? "Please remember or photograph this number. Winners are called by number during dinner." : "Take a screenshot of this screen. Winners are called by number during dinner."}));
  app.append(card);
  if (B.view === "kiosk"){
    let left = 20;
    const next = el("button", {class:"btn primary big", type:"button", text:"Next person (" + left + ")"});
    next.addEventListener("click", () => { clearInterval(kioskTimer); viewForm(); });
    card.append(next);
    kioskTimer = setInterval(() => { left--; next.textContent = "Next person (" + left + ")"; if (left <= 0){ clearInterval(kioskTimer); viewForm(); } }, 1000);
  } else {
    app.append(el("p", {class:"muted small center", text:"Each person registers once, on their own phone. Need help? Please go to the registration counter."}));
  }
}

/* ---------- dashboard (staff PIN) ---------- */
function viewDashboard(){
  const saved = sessionStorage.getItem("ghg-pin");
  if (!saved){
    clear();
    const inp = el("input", {type:"password", inputmode:"numeric", autocomplete:"off", "aria-label":"Staff PIN", placeholder:"Staff PIN"});
    const msg = el("p", {class:"msg", role:"status"});
    const btn = el("button", {class:"btn primary big", type:"submit", text:"Open dashboard"});
    const f = el("form", null, inp, msg, btn);
    f.addEventListener("submit", async e => { e.preventDefault(); btn.disabled = true;
      try{ await call("apiCheckPin", inp.value); sessionStorage.setItem("ghg-pin", inp.value); viewDashboard(); }
      catch(err){ msg.textContent = errText(err); btn.disabled = false; inp.select(); } });
    app.append(el("div", {class:"card center"}, el("h2", {text:"Staff only"}), el("p", {class:"muted", text:"Enter the staff PIN to see registrations."}), f));
    inp.focus(); return;
  }
  document.body.classList.add("wide", "dashmode"); clear();
  const hues = ["--jade","--saffron","--rose","--lapis","--gold"];
  let rows = [], lastTotal = null;
  const totalNum = el("span", {class:"db-total-num", text:"0"});
  const live = el("p", {class:"db-live"}, el("span", {class:"db-dot", "aria-hidden":"true"}), el("span", {text:"Live"}));
  const lastAt = el("p", {class:"db-sub"});
  const orgBox = el("div", {class:"db-orgs"});
  const deptList = el("div", {class:"db-depts"});
  const deptCount = el("span", {class:"db-pill"});
  const feed = el("ul", {class:"feed"});
  const copyBtn = el("button", {class:"btn primary", type:"button", text:"Copy lucky draw list"});
  copyBtn.addEventListener("click", async () => {
    if (!rows.length){ toast("Nobody has registered yet."); return; }
    const txt = ["Lucky No\tName\tStaff ID\tDepartment"].concat(rows.map(r => [r.luckyNo, r.name, r.staffId || "", r.dept].join("\t"))).join("\n");
    let ok = false;
    try{ await navigator.clipboard.writeText(txt); ok = true; }
    catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.append(ta); ta.select(); try{ ok = document.execCommand("copy"); }catch(_){} ta.remove(); }
    toast(ok ? rows.length + " numbers copied." : "Copy didn’t work here. Use Download list instead.");
  });
  const dlBtn = el("button", {class:"btn", type:"button", text:"Download list (CSV)"});

/* ---------- confetti ---------- */
function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let cv = document.getElementById("confetti");
  if (!cv){ cv = el("canvas", {id:"confetti", "aria-hidden":"true"}); document.body.append(cv); }
  const cx = cv.getContext("2d"), dpr = devicePixelRatio || 1; cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cs = getComputedStyle(document.documentElement), cols = ["--jade","--saffron","--rose","--lapis","--gold"].map(h => cs.getPropertyValue(h).trim());
  let bits = []; for (let i = 0; i < 200; i++){ const a = Math.random()*Math.PI*2, s = 4+Math.random()*9; bits.push({x:innerWidth/2, y:innerHeight*.45, vx:Math.cos(a)*s, vy:Math.sin(a)*s-5, w:5+Math.random()*7, h:3+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.35, c:cols[i%5], life:0}); }

    bits.forEach(b => { b.vy += .22; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++; cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.globalAlpha = Math.max(0, 1-b.life/200); cx.fillStyle = b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore(); });
    bits = bits.filter(b => b.life < 200 && b.y < innerHeight+40); if (bits.length) requestAnimationFrame(frame); else cx.clearRect(0,0,innerWidth,innerHeight); })();
}
